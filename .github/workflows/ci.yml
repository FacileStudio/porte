name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Pinned to 1.25, the floor go.mod documents. It was going to be 1.24 to
  # match tronc and caisse; go-oidc v3.20 requires >= 1.25, so the floor was
  # decided by the dependency rather than by us. The apps are already there.
  check:
    runs-on: ubuntu-latest

    # porte/pg's tests need this: everything interesting in that package is
    # PostgreSQL's own behaviour, so a fake would test the fake. They skip
    # themselves when the URL is unset, which is why CI always sets it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: porte
          POSTGRES_PASSWORD: porte
          POSTGRES_DB: porte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORTE_TEST_DATABASE_URL: postgres://porte:porte@localhost:5432/porte_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
