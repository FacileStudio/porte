name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The Go version comes from go.mod, so CI can never build with a toolchain
  # older than the module declares: a pinned 1.25 under a go 1.26 module made
  # the toolchain switch mid-build and every compile failed on a version skew.
  check:
    runs-on: ubuntu-latest

    # porte/pg's tests need this: everything interesting in that package is
    # PostgreSQL's own behaviour, so a fake would test the fake. They skip
    # themselves when the URL is unset, which is why CI always sets it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: porte
          POSTGRES_PASSWORD: porte
          POSTGRES_DB: porte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORTE_TEST_DATABASE_URL: postgres://porte:porte@localhost:5432/porte_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: nested modules
        run: for m in directory forfait; do (cd "$m" && go vet ./... && go test -race ./...) || exit 1; done
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
